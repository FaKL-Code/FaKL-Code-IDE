version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Os tipos do Node acompanham a versão do Node usada (.nvmrc), não a mais nova.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # O 2.x do SDK do ACP tirou o `usage` por rodada da API estável (agora só em
      # `/unstable`), que alimenta o teto diário de gasto e o placar dos agentes.
      - dependency-name: '@agentclientprotocol/sdk'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
