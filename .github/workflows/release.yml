name: Release

# Publica uma versão da FaKL-Code como GitHub Release neste repositório
# (público). Só roda quando alguém pede, pelo botão
# Run workflow na main; a tag vX.Y.Z é criada no commit escolhido se ainda não
# existir.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versão a publicar (ex. v0.1.0)
        required: true
      plataformas:
        description: Plataformas da release
        type: choice
        options: [todas, windows, macos, linux]
        default: todas

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      plataformas: ${{ inputs.plataformas }}
      versao: ${{ inputs.tag }}

  # Assina os instaladores .exe no SignPath. O pedido ao SignPath Foundation foi
  # recusado, então hoje a variável SIGNPATH_ORGANIZATION_ID não existe, este job é
  # pulado e o Windows sai sem assinatura. Fica aqui para o caso de um novo pedido ser
  # aprovado: com a variável definida ele volta a rodar. Veja docs/assinatura.md.
  assinar-windows:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != '' && inputs.plataformas != 'macos' && inputs.plataformas != 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fakl-code-windows-x64
          path: bruto

      # O SignPath lê um artefato do GitHub: sobe só os .exe, com outro nome.
      - id: enviar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sem-assinatura
          path: bruto/*.exe
          retention-days: 2
          if-no-files-found: error

      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.enviar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: assinado

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-assinado
          path: assinado/*.exe
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: [build, assinar-windows]
    # Roda também quando a assinatura foi pulada (variável ausente), mas não se ela falhou.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.assinar-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fakl-code-*
          path: dist
          merge-multiple: true

      # Os .exe assinados substituem os de mesmo nome.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.assinar-windows.result == 'success'
        with:
          name: windows-assinado
          path: dist

      # Nomes fixos dos instaladores (o do Windows é o por usuário, sem pedir
      # admin), para o site apontar para releases/download/<tag>/<nome>.
      - name: Nomes fixos dos instaladores
        working-directory: dist
        run: |
          shopt -s nullglob
          setup=(*UserSetup-x64-*.exe)
          if (( ${#setup[@]} == 0 )); then
            setup=(*Setup-x64-*.exe)
          fi
          if (( ${#setup[@]} >= 1 )); then
            cp -- "${setup[0]}" FaKL-Code-Windows-x64.exe
          fi
          mac=(*-darwin-arm64-*.zip)
          if (( ${#mac[@]} >= 1 )); then
            cp -- "${mac[0]}" FaKL-Code-macOS-arm64.zip
          fi
          linux_tar=(*-linux-x64-*.tar.gz)
          if (( ${#linux_tar[@]} >= 1 )); then
            cp -- "${linux_tar[0]}" FaKL-Code-Linux-x64.tar.gz
          fi
          linux_deb=(*.deb)
          if (( ${#linux_deb[@]} >= 1 )); then
            cp -- "${linux_deb[0]}" FaKL-Code-Linux-x64.deb
          fi
          linux_rpm=(*.rpm)
          if (( ${#linux_rpm[@]} >= 1 )); then
            cp -- "${linux_rpm[0]}" FaKL-Code-Linux-x64.rpm
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag inválida: ${TAG} (use vX.Y.Z)" >&2
            exit 1
          fi
          version="${TAG#v}"
          code_oss="$(jq -r '.tag' upstream/stable.json)"
          prerelease=""
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${TAG}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FaKL-Code ${version} (Code-OSS ${code_oss})" \
            --generate-notes \
            ${prerelease}

      # Manifestos que o serviço de atualização da IDE lê (ADR 0037). Vão para a
      # branch `atualizacoes` depois da release, quando os instaladores já existem
      # nas URLs. A tag precisa ser vX.Y.Z; as outras não entram na atualização.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !contains(inputs.tag, '-') }}
        with:
          ref: atualizacoes
          path: atualizacoes

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !contains(inputs.tag, '-') }}
        with:
          node-version-file: .nvmrc

      - name: Manifestos de atualização
        if: ${{ !contains(inputs.tag, '-') }}
        run: |
          node build/manifestos-update.mjs dist atualizacoes "${TAG}" "${GITHUB_REPOSITORY}"
          cd atualizacoes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "manifestos já em dia"
          else
            git commit -q -m "chore: manifestos de atualização da ${TAG}"
            git push origin HEAD:atualizacoes
          fi

  # Imagem do relay com as tags da versão (X.Y.Z e X.Y) no GHCR.
  relay:
    needs: publish
    # Sem o if, o assinar-windows pulado (sem SignPath) pula o relay junto.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/relay.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ inputs.tag }}

  # Publica os manifestos do Scoop e do Homebrew nos repositórios próprios (docs/distribuicao.md).
  # Usa uma chave de deploy por repositório (secrets EMPACOTAMENTO_CHAVE_SCOOP e
  # EMPACOTAMENTO_CHAVE_TAP): cada uma só escreve no repositório dela, ao contrário de um token
  # da conta. Sem as chaves, o job só avisa. O winget segue por PR ao microsoft/winget-pkgs.
  empacotar:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(inputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      CHAVE_SCOOP: ${{ secrets.EMPACOTAMENTO_CHAVE_SCOOP }}
      CHAVE_TAP: ${{ secrets.EMPACOTAMENTO_CHAVE_TAP }}
    steps:
      - id: ativo
        run: |
          if [[ -z "${CHAVE_SCOOP}" || -z "${CHAVE_TAP}" ]]; then
            echo "sim=nao" >> "${GITHUB_OUTPUT}"
            echo "::notice::chaves de empacotamento ausentes: Scoop e Homebrew não foram atualizados (docs/distribuicao.md)"
          else
            echo "sim=sim" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ativo.outputs.sim == 'sim'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ativo.outputs.sim == 'sim'
        with:
          node-version-file: .nvmrc

      - name: Gerar os manifestos
        if: steps.ativo.outputs.sim == 'sim'
        run: node build/empacotar.mjs "${TAG}" saida

      - name: Scoop e Homebrew
        if: steps.ativo.outputs.sim == 'sim'
        run: |
          mkdir -p ~/.ssh
          # As chaves de host do GitHub, pela API (HTTPS), em vez de confiar no primeiro contato.
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          printf '%s\n' "${CHAVE_SCOOP}" > ~/.ssh/chave-scoop
          printf '%s\n' "${CHAVE_TAP}" > ~/.ssh/chave-tap
          chmod 600 ~/.ssh/chave-scoop ~/.ssh/chave-tap
          publicar() {
            local repo="$1" chave="$2" origem="$3" destino="$4"
            export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/${chave} -o IdentitiesOnly=yes"
            git clone --depth 1 "git@github.com:FaKL-Code/${repo}.git" "${repo}"
            mkdir -p "${repo}/$(dirname "${destino}")"
            cp "${origem}" "${repo}/${destino}"
            git -C "${repo}" config user.name "github-actions[bot]"
            git -C "${repo}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "${repo}" add -A
            if git -C "${repo}" diff --cached --quiet; then
              echo "${repo}: já em dia"
            else
              git -C "${repo}" commit -q -m "fakl-code ${TAG#v}"
              git -C "${repo}" push -q origin HEAD
            fi
          }
          publicar scoop-bucket chave-scoop saida/scoop/bucket/fakl-code.json bucket/fakl-code.json
          publicar homebrew-tap chave-tap saida/homebrew/Casks/fakl-code.rb Casks/fakl-code.rb
