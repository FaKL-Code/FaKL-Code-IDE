name: Release

# Publica uma versão da FaKL-Code como GitHub Release neste repositório
# (público). Só roda quando alguém pede, pelo botão
# Run workflow na main; a tag vX.Y.Z é criada no commit escolhido se ainda não
# existir.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versão a publicar (ex. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      plataformas: todas

  # Assina os instaladores .exe no SignPath (programa gratuito para open source).
  # Só roda quando o repositório define a variável SIGNPATH_ORGANIZATION_ID; sem ela
  # a release sai com o Windows sem assinatura. Veja docs/assinatura.md.
  assinar-windows:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fakl-code-windows-x64
          path: bruto

      # O SignPath lê um artefato do GitHub: sobe só os .exe, com outro nome.
      - id: enviar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sem-assinatura
          path: bruto/*.exe
          retention-days: 2
          if-no-files-found: error

      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.enviar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: assinado

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-assinado
          path: assinado/*.exe
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: [build, assinar-windows]
    # Roda também quando a assinatura foi pulada (variável ausente), mas não se ela falhou.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.assinar-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fakl-code-*
          path: dist
          merge-multiple: true

      # Os .exe assinados substituem os de mesmo nome.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.assinar-windows.result == 'success'
        with:
          name: windows-assinado
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag inválida: ${TAG} (use vX.Y.Z)" >&2
            exit 1
          fi
          version="${TAG#v}"
          code_oss="$(jq -r '.tag' upstream/stable.json)"
          prerelease=""
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${TAG}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FaKL-Code ${version} (Code-OSS ${code_oss})" \
            --generate-notes \
            ${prerelease}

  # Imagem do relay com as tags da versão (X.Y.Z e X.Y) no GHCR.
  relay:
    needs: publish
    uses: ./.github/workflows/relay.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ inputs.tag }}
