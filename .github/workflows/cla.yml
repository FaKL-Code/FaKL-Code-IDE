name: CLA

# Pede a assinatura do CLA.md em PRs de quem ainda não assinou. As assinaturas ficam
# em .github/cla/assinaturas.json, no branch `cla-assinaturas` (a main é protegida).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Assinatura do CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      # pull_request_target roda com permissões de escrita: este job NÃO faz checkout
      # do código do PR, só executa a ação fixada abaixo.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla/assinaturas.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-assinaturas
          allowlist: dependabot[bot],github-actions[bot]
