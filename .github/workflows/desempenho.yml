name: Desempenho do Core

# Mede o Core empacotado (RNF-03: ocioso abaixo de 150 MB e 1% de CPU) e a carga
# com 10 agentes simulados (RNF-04). Fica fora do CI de PR porque depende de
# timing e demora; roda toda semana e sob demanda. Os números vão para o
# resumo do job. Como rodar na máquina: CONTRIBUTING.md, seção "Desempenho".
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    name: Desempenho (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Git Bash no PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Medir
        env:
          FAKL_PERF_OUT: ${{ runner.temp }}/perf.jsonl
        run: |
          status=0
          pnpm test:perf || status=$?
          # O resumo sai mesmo se um limite estourar: o número é o que interessa.
          if [[ -f "${FAKL_PERF_OUT}" ]]; then
            node packages/core/test-perf/resumo.mjs "${FAKL_PERF_OUT}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${status}"
