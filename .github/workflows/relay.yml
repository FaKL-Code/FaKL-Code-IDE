name: Imagem do relay

# Publica a imagem do relay do controle remoto (SDD 12.1) no GitHub Container
# Registry, em ghcr.io/<dono do repositório>/fakl-relay, para amd64 e arm64:
# um fork publica no próprio registry, sem nada a mudar aqui.
#
# Tags: `latest` e `main` a cada push na main, `X.Y.Z` e `X.Y` nas versões
# (tag vX.Y.Z, ou chamado pelo release.yml, porque a tag que ele cria não
# dispara outros workflows) e `sha-<commit>` sempre. Nunca roda em pull
# request: código de fork não chega perto do token que publica.
#
# O mesmo job deixa o pacote `fakl-relay` (relay.mjs, PWA e arquivos do Docker
# Compose) como artefato, para quem prefere gerar a imagem no próprio VPS.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Filtro de caminhos não vale para tags: versões sempre publicam.
    paths:
      - packages/relay/**
      - packages/remote/**
      - packages/protocol/**
      - packages/voz/**
      - packages/cafe/**
      - packages/conversa/**
      - apps/remote-pwa/**
      - branding/logo/**
      - pnpm-lock.yaml
      - .nvmrc
      - .github/workflows/relay.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Versão publicada (vX.Y.Z), para as tags X.Y.Z e X.Y da imagem
        type: string
        required: false

permissions:
  contents: read

jobs:
  imagem:
    name: Imagem multi-arch
    # Só publica quando o repositório é público; no privado os runners do GitHub
    # não estão disponíveis.
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fakl/remote-pwa... build
      - run: pnpm --filter @fakl/relay... build
      - run: pnpm --filter @fakl/relay pack:relay

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fakl-relay
          path: packages/relay/out/fakl-relay/
          retention-days: 30
          if-no-files-found: error

      - name: Nome da imagem
        id: nome
        env:
          OWNER: ${{ github.repository_owner }}
        # O GHCR só aceita nomes em minúsculas.
        run: echo "imagem=ghcr.io/${OWNER,,}/fakl-relay" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.nome.outputs.imagem }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=fakl-relay
            org.opencontainers.image.description=Relay do controle remoto da FaKL-Code IDE: repassa bytes cifrados de ponta a ponta, serve o app do celular e envia Web Push.

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/relay/out/fakl-relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fakl-relay
          cache-to: type=gha,mode=max,scope=fakl-relay
