<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>FaKL-Code</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131B2C"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.6" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#06E0FF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#5EEBFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#202A3B"/>
      <stop offset="0.45" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glyphGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#halo)"/>
  <!-- terminal em perspectiva: brilho, espessura e face -->
  <path d="M283 454 Q280 376 356 358 L680 284 Q756 266 761 344 L783 682 Q788 760 710 767 L372 795 Q294 802 291 724 Z" fill="#2563EB" filter="url(#glow)" opacity="0.85"/>
  <path d="M283 454 Q280 376 356 358 L680 284 Q756 266 761 344 L783 682 Q788 760 710 767 L372 795 Q294 802 291 724 Z" fill="url(#side)"/>
  <path d="M239 424 Q236 346 312 328 L636 254 Q712 236 717 314 L739 652 Q744 730 666 737 L328 765 Q250 772 247 694 Z" fill="url(#panel)" stroke="url(#rim)" stroke-width="10"/>
  <path d="M264 408 Q262 368 301 359 L651 277 Q690 268 695 308 L695 312 Q700 352 663 366 L305 506 Q268 520 266 480 Z" fill="url(#sheen)"/>
  <!-- prompt >_ -->
  <g fill="none" stroke="#06E0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="58">
    <g filter="url(#glyphGlow)" opacity="0.8">
      <path d="M344 470 L454 560 L344 650"/>
      <path d="M512 668 H650"/>
    </g>
    <path d="M344 470 L454 560 L344 650"/>
    <path d="M512 668 H650"/>
  </g>
</svg>
